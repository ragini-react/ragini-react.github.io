name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Rebuild every night so open roles (and their JobPosting data) stay current.
  schedule:
    - cron: "30 0 * * *" # 06:00 IST
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Needs Settings → Pages → Source set to "GitHub Actions"; if Pages is off or
      # set to "Deploy from a branch" this step fails with "Get Pages site failed".
      - id: pages
        uses: actions/configure-pages@v6

      - run: npm ci

      - name: Type check, lint, unit tests
        run: |
          npm run typecheck
          npm run lint
          npm test

      # `npm run build` runs scripts/fetch-jobs.mjs first (prebuild).
      - name: Build static site
        run: npm run build
        env:
          BASE_PATH: ${{ vars.PAGES_BASE_PATH || steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://walkover.in' }}
          NEXT_PUBLIC_NOINDEX: ${{ vars.NEXT_PUBLIC_NOINDEX }}
          NEXT_PUBLIC_CONTACT_ENDPOINT: ${{ vars.NEXT_PUBLIC_CONTACT_ENDPOINT }}
          NEXT_PUBLIC_NEWSLETTER_ENDPOINT: ${{ vars.NEXT_PUBLIC_NEWSLETTER_ENDPOINT }}
          NEXT_PUBLIC_MAILCHIMP_URL: ${{ vars.NEXT_PUBLIC_MAILCHIMP_URL }}

      - name: Check internal links
        run: node scripts/check-links.mjs --internal-only
        env:
          BASE_PATH: ${{ vars.PAGES_BASE_PATH || steps.pages.outputs.base_path }}

      # Also serve a full copy under /walkover-web/ (the site's earlier address).
      # `next build` directly skips prebuild, so both copies share one jobs.json.
      - name: Build /walkover-web/ copy
        run: |
          mv out out-root
          npx next build
          node scripts/check-links.mjs --internal-only
          mv out out-root/walkover-web
          mv out-root out
        env:
          BASE_PATH: /walkover-web
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://walkover.in' }}
          NEXT_PUBLIC_NOINDEX: ${{ vars.NEXT_PUBLIC_NOINDEX }}
          NEXT_PUBLIC_CONTACT_ENDPOINT: ${{ vars.NEXT_PUBLIC_CONTACT_ENDPOINT }}
          NEXT_PUBLIC_NEWSLETTER_ENDPOINT: ${{ vars.NEXT_PUBLIC_NEWSLETTER_ENDPOINT }}
          NEXT_PUBLIC_MAILCHIMP_URL: ${{ vars.NEXT_PUBLIC_MAILCHIMP_URL }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
